# The op script applied to one KB. See README.md beside this
# file for the placeholders and how the script is rendered and run.
steps:
  - name: premise
    reissue: refused
    reissue-detail: "node exists: "
    values:
      entry:
        - operation: add-claim
          title: Compatibility Probe Premise
          rigor: 0.9
          rationale: Written by the compatibility op script as the result the probe rests on.
          document: "{leaf}"
          line: "{line}"
          snippet: "{snippet}"
  - name: probe
    reissue: refused
    reissue-detail: "node exists: "
    values:
      entry:
        - operation: add-claim
          title: Compatibility Probe Result
          rigor: 0.5
          rationale: Written by the compatibility op script to exercise the write API.
          document: "{leaf}"
          line: "{line}"
          snippet: "{snippet}"
  - name: work
    reissue: refused
    reissue-detail: "node exists: "
    values:
      entry:
        - operation: add-work
          label: CompatProbe2026
          title: Compatibility Probe (2026)
          rigor: "*pending*"
          rationale: A work the probe rests on; no bibliography answers its key.
  - reissue: refused
    reissue-detail: "edge exists: "
    values:
      entry:
        - operation: add-edge
          source: "{minted:premise}"
          target: "{minted:probe}"
          relation: supports
          bearing: "*pending*"
          context: the result the probe extends
        - operation: add-edge
          source: "{minted:work}"
          target: "{minted:probe}"
          relation: founds
          bearing: "*pending*"
        - operation: add-edge
          source: "{minted:probe}"
          target: "{minted:premise}"
          relation: references
  - reissue: unchanged
    values:
      entry:
        - operation: edit-claim
          id: "{minted:probe}"
          rigor: 0.75
        - operation: edit-edge
          source: "{minted:work}"
          target: "{minted:probe}"
          relation: founds
          bearing: 0.5
